[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-database"
version = "0.3.0"
description = "Financial market data platform"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3",
    "aiohttp>=3.9",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "sqlalchemy>=2.0",
]

[project.scripts]
financial-db = "financial_database.cli:cli"
financial-database = "financial_database.cli:cli"

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pyright]
venv = ".venv"

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]