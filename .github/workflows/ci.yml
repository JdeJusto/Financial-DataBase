name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # The dev extra carries pytest, pytest-asyncio and sqlalchemy, which
        # the unit suite imports.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the unit suite
        # The integration suite needs a PostgreSQL instance; it is out of
        # scope here and documented in CONTRIBUTING.md.
        run: python -m pytest tests/unit -q

  compile:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the sources
        run: python -m compileall -q src
