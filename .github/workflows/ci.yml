name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # The dev extra carries pytest, pytest-asyncio and sqlalchemy, which
        # the unit suite imports.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the unit suite
        # The integration suite needs a PostgreSQL instance; it is out of
        # scope here and documented in CONTRIBUTING.md.
        run: python -m pytest tests/unit -q

  database-tests:
    name: PostgreSQL integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: financial_database_test
          POSTGRES_USER: financial
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U financial -d financial_database_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://financial:test@localhost:5432/financial_database_test
      TEST_DB_NAME: financial_database_test
      TEST_DB_USER: financial
      TEST_DB_PASSWORD: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply test database migrations
        run: python -m financial_database.cli migrate

      - name: Run integration tests
        run: python -m pytest tests/integration -q

  compile:
    name: Compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Byte-compile the sources
        run: python -m compileall -q src
