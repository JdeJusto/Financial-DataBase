version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-type: "action"
    ignore:
      - dependency-type: "action"
        update-type: "version"
        update-value: "!"
        match-patterns:
          - "actions/checkout@v*"
          - "actions/setup-node@v*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-scopes: ["dependencies"]
  - package-ecosystem: "pyup"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10